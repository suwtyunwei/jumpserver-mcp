[project]
name = "jumpserver-mcp-curated"
version = "0.2.0"
description = "JumpServer MCP server with a curated common + security toolset"
requires-python = ">=3.11"
dependencies = [
    "fastapi-mcp==0.3.3",
    "mcp==1.7.1",
    "fastapi==0.115.12",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic==2.11.7",
    "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jumpserver_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
